services:
  # Serviço principal: React app com Vite
  app:
    container_name: glow-report-dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000
    command: npm run dev
    restart: unless-stopped
    networks:
      - glow-network

networks:
  glow-network:
    driver: bridge
